<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin Login | ReValue Hub</title>
    <link rel="icon" type="image/png" href="assets/favicon.png?v=2" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary": "#0053db",
              "surface": "#ffffff",
              "background": "#faf8ff",
              "on-surface": "#191b23",
              "outline-variant": "#c3c6d7",
              "on-surface-variant": "#434655",
              "error": "#ba1a1a"
            },
            "fontFamily": {
              "body-md": ["Manrope"],
              "label-md": ["Manrope"],
              "headline-xl": ["Manrope"]
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen">
<main class="flex min-h-screen">
    <!-- Left Side: Visual Brand Canvas (Darker for Admin) -->
    <section class="hidden lg:flex lg:w-1/2 relative flex-col justify-between p-10 overflow-hidden bg-slate-900">
        <div class="absolute inset-0 z-0">
            <img alt="" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmlJemSqSV0YIQjIRK2ydjwrm6L0fZjOqImd3QbOPfZ_NCPcrY5ZwoWeIBiZ1rkXVkkw0Y965Kxl58C6JVAOiRV-H_eibSgu_QtB_xLPD6tSp2murYnZ2J2Ia8etQo6zN4w8y1qsSgZJa03sURAhwv8pPznviBTugr5OG08pmJ3KLVZPvsOqI5Ss4YvmIhBmC7eYmMi6Jyxw7QiJGpJRBNygOZcfRlD19jVORBLQ_Ft2aIezevPvSIcZaOW83AXvR4sbPy8xWxoJ4"/>
            <div class="absolute inset-0 bg-gradient-to-br from-[#0f172a]/90 to-[#1e293b]/80"></div>
        </div>
        <div class="relative z-10 flex items-center gap-3">
            <a href="landing.html"><img src="assets/logo.png?v=2" alt="ReValue Hub" class="h-10 w-auto object-contain brightness-0 invert" /></a>
        </div>
        <div class="relative z-10 mt-auto">
            <h1 class="text-white text-3xl font-bold mb-3">Admin Console Access</h1>
            <p class="text-white/80 text-base max-w-sm leading-relaxed">
                Secure gateway for ReValue Hub administrators to manage the community, moderate content, and view analytics.
            </p>
        </div>
    </section>

    <!-- Right Side: Authentication Form -->
    <section class="w-full lg:w-1/2 flex flex-col items-center justify-center p-8 bg-surface min-h-screen">
        <div class="w-full max-w-md space-y-10 flex-1 flex flex-col justify-center">
            <!-- Header -->
            <div class="space-y-2">
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-blue-50 text-primary rounded-full text-sm font-bold mb-4">
                    <span class="material-symbols-outlined text-[18px]">admin_panel_settings</span>
                    Administrator
                </div>
                <h2 class="text-on-surface text-3xl font-bold">Admin Login</h2>
                <p class="text-on-surface-variant font-body-md">Enter your admin credentials to securely access the console.</p>
            </div>
            
            <div id="admin-login-error" class="hidden p-4 rounded-xl bg-error/10 text-error font-bold text-sm"></div>

            <!-- Form -->
            <form id="admin-login-form" class="space-y-6">
                <!-- Email Field -->
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-on-surface-variant" for="email">Admin Email Address</label>
                    <div class="relative group">
                        <input class="w-full h-14 px-4 bg-white border border-outline-variant rounded-xl text-on-surface font-body-md transition-all outline-none focus:border-primary focus:ring-4 focus:ring-primary/10" id="email" name="email" placeholder="admin@revalue.com" required type="email"/>
                    </div>
                </div>
                
                <!-- Password Field -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-bold text-on-surface-variant" for="password">Password</label>
                    </div>
                    <div class="relative group">
                        <input class="w-full h-14 px-4 bg-white border border-outline-variant rounded-xl text-on-surface font-body-md transition-all outline-none focus:border-primary focus:ring-4 focus:ring-primary/10" id="password" name="password" placeholder="••••••••" required type="password"/>
                        <button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
                            <span class="material-symbols-outlined text-xl">visibility</span>
                        </button>
                    </div>
                </div>
                
                <!-- Sign In Button -->
                <button class="w-full h-14 bg-slate-900 text-white text-base font-bold rounded-xl shadow-sm hover:bg-slate-800 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Sign In to Console
                </button>
            </form>
            
            <!-- Footer Link -->
            <div class="text-center mt-8">
                <p class="text-on-surface-variant text-sm">
                    Not an administrator? 
                    <a class="text-primary font-bold hover:underline" href="login.html">Return to User Login</a>
                </p>
            </div>
        </div>
    </section>
</main>

<script src="js/admin-login.js"></script>
</body>
</html>
